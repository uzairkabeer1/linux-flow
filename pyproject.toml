[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "linux-flow"
version = "0.1.0"
description = "Hold-to-talk voice dictation for Linux (X11 + Wayland), backed by your Wispr Flow account"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "sounddevice>=0.4.6",
    "numpy>=1.24",
    "httpx>=0.27",
    "evdev>=1.6; sys_platform == 'linux'",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
local = ["faster-whisper>=1.0"]
opus = ["opuslib>=3.0"]
cleanup = ["anthropic>=1.0"]
x11 = ["pynput>=1.7"]

[project.scripts]
linux-flow = "linux_flow.cli:main"

[tool.setuptools.packages.find]
include = ["linux_flow*"]
